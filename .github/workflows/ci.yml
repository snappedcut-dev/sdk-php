name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the floor composer.json claims, so it is tested rather than hoped for.
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit --no-coverage

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      # Level 9 is the strictest PHPStan has. It is worth it here because every
      # field in a response is a claim from across a network, and a cast of
      # `mixed` to `int` would hide a malformed one behind a plausible 0.
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
