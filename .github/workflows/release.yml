name: Release

# Packagist pulls from this tag; there is nothing to upload. So "releasing" is
# proving the tag is good, and Packagist picks it up on its own crawl.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, json
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer validate --strict
      - run: vendor/bin/phpunit --no-coverage
      - run: vendor/bin/phpstan analyse --no-progress
      # The tag is the source of truth, and Composer has no version field to
      # check it against, so the check is that the tag is reachable and signed
      # off by the tests above. Packagist then serves exactly this tree.
      - name: The tag must point at this commit
        run: |
          [ "$(git rev-list -n1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}" ] \
            || { echo "tag does not point at the tested commit"; exit 1; }
